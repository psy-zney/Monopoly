services:
  game-server:
    image: monopoly-server:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    init: true
    environment:
      PORT: "3001"
      CLIENT_ORIGIN: "${CLIENT_ORIGIN:-*}"
    ports:
      - "127.0.0.1:9004:3001"
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
